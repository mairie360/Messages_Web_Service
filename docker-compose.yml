# Stack de développement du front Messages : base, Message API, BFF Message et ce front
# (development.Dockerfile, `next dev` avec synchronisation de src/).
#
#   docker compose up --watch      (NODE_AUTH_TOKEN exporté pour le build)
#
# BFF Message est le seul BFF du front ; son image suit la version du paquet de contrat
# @mairie360/bff-message-openapi épinglée dans package.json.

volumes:
  postgres-data:
  redis-data:

networks:
  backend:
  frontend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-password}
  DB_HOST: postgres
  DB_PORT: 5432

services:
  postgres:
    image: ghcr.io/mairie360/database:dev-latest
    restart: always
    container_name: mairie360-db-message-front
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: ghcr.io/mairie360/liquibase-migrations:dev-latest
    container_name: mairie360-liquibase-message-front
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: ${DB_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD:-password}
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog
    command: >
      --changelog-file=changelog.xml
      update
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: mairie360-redis-message-front
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  message-api:
    container_name: message-api-front-message-developpement
    image: ghcr.io/mairie360/message-api:dev-latest
    ports:
      - "3003:3003"
    networks:
      - backend
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3003
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://core.development.mairie360.fr
      JWT_SECRET: b"secret"
      JWT_TIMEOUT: 3600
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  bff-message:
    container_name: bff-message-message-front
    image: ${BFF_MESSAGE_IMAGE:-ghcr.io/mairie360/bff-message:0.4.0}
    ports:
      - "4003:4003"
    networks:
      - backend
      - frontend
    environment:
      # Base PostgreSQL : table users (contacts et utilisateur courant).
      <<: *db-env
      PORT: 4003
      MESSAGE_API_URL: message-api
      MESSAGE_API_PORT: 3003
      MESSAGE_API_BASE_PATH: http://message-api:3003/api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      message-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4003/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  message-front:
    container_name: message-front-developpement
    build:
      context: .
      dockerfile: development.Dockerfile
      secrets:
        - NODE_AUTH_TOKEN
    # `npm run dev` écoute sur 5003 (`next dev -p 5003`).
    ports:
      - "5003:5003"
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: package.json
    environment:
      HOSTNAME: "0.0.0.0"
      BFF_MESSAGE_BASE_URL: http://bff-message:4003
      # Surveillance des fichiers synchronisés dans le conteneur.
      WATCHPACK_POLLING: "true"
    networks:
      - frontend
    healthcheck:
      # Sans cookie, le middleware répond 307 (redirection Login) : curl -f l'accepte.
      test: ["CMD", "curl", "-f", "http://localhost:5003"]
      interval: 10s
      retries: 3

secrets:
  NODE_AUTH_TOKEN:
    environment: NODE_AUTH_TOKEN
