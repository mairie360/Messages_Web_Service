# Stack de test de sécurité dynamique (DAST) ISOLÉE pour le front Messages (Messages_Web_Service).
#
#   ./security_test.sh            (local, NODE_AUTH_TOKEN exporté pour le build)
#   docker compose -f docker-compose-security.yml up --build \
#       --abort-on-container-exit --exit-code-from security-scan   (CI)
#
# security-scan (OWASP ZAP baseline) explore l'application Next.js servie par
# l'image de production (Dockerfile, sortie standalone) avec un cookie de session
# accessToken valide (replacer), comme un navigateur authentifié : pages, assets,
# en-têtes HTTP et routes relayées vers BFF Message. Sort en échec sur toute alerte
# WARN/FAIL non neutralisée dans .zap/rules.tsv (les alertes informatives y sont
# passées à IGNORE).

volumes:
  postgres-data:
  redis-data:

secrets:
  node_auth_token:
    environment: NODE_AUTH_TOKEN

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

# MAIR-680: Core alone signs the session JWTs (EdDSA) with the run's Ed25519 key pair of
# stack_secrets.sh; every other service only gets the public key. No JWT_SECRET, so no HS256 token
# is accepted. The front relays its accessToken cookie as is (Bearer) down the chain.
x-api-env: &api-env
  <<: *db-env
  HOST: "0.0.0.0"
  REDIS_URL: redis://redis:6379
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
  JWT_TIMEOUT: 3600

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:${UPSTREAM_TAG:-dev}}
    pull_policy: ${UPSTREAM_PULL_POLICY:-always}
    container_name: message-front-sec-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:${UPSTREAM_TAG:-dev}}
    pull_policy: ${UPSTREAM_PULL_POLICY:-always}
    container_name: message-front-sec-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true;
    # without it the migration fails on a fresh database. Test / dev stacks only.
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:19-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
    container_name: message-front-sec-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: message-front-sec-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  message-api:
    image: ${MESSAGE_API_IMAGE:-ghcr.io/mairie360/message-api:${UPSTREAM_TAG:-dev}}
    pull_policy: ${UPSTREAM_PULL_POLICY:-always}
    container_name: message-front-sec-message-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3003
      PUBLIC_URL: http://message-api:3003
      # The API rate-limits each account (MAIR-425): the scan / load test hammer it as one user.
      RATE_LIMIT_ENABLED: "false"
      # Message API also throttles each client IP with a token bucket (actix-governor): "0" disables it,
      # otherwise the k6 load test turns into 429s relayed as 502 by the BFF.
      RATE_LIMIT_PER_SECOND: "0"
    expose:
      - "3003"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur message-api-ready ci-dessous.

  message-api-ready:
    image: curlimages/curl:latest
    container_name: message-front-sec-message-api-ready
    depends_on:
      message-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://message-api:3003/health >/dev/null; do
      echo "waiting for message-api..."; sleep 2; done; echo "message-api ready"'
    networks:
      - backend

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:${UPSTREAM_TAG:-dev}}
    pull_policy: ${UPSTREAM_PULL_POLICY:-always}
    container_name: message-front-sec-core-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3000
      PUBLIC_URL: http://core-api:3000
      # Core refuses to start without its Resend configuration (MAIR-522). No page of this front sends an
      # e-mail through these stacks, so the key is fake and the URL never called.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend.invalid"
      EMAIL_DOMAIN: "mairie360.local"
      # MAIR-680: Core alone signs the session JWTs (EdDSA) with the run's Ed25519 key pair.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
      # The API rate-limits each account (MAIR-425): the scan / load test hammer it as one user.
      RATE_LIMIT_ENABLED: "false"
    expose:
      - "3000"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur core-api-ready ci-dessous.

  core-api-ready:
    image: curlimages/curl:latest
    container_name: message-front-sec-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core-api:3000/health >/dev/null; do
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  bff-message:
    image: ${BFF_MESSAGE_IMAGE:-ghcr.io/mairie360/bff-message:${UPSTREAM_TAG:-dev}}
    pull_policy: ${UPSTREAM_PULL_POLICY:-always}
    container_name: message-front-sec-bff-message
    depends_on:
      seeder:
        condition: service_completed_successfully
      message-api-ready:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 4003
      MESSAGE_API_URL: message-api
      MESSAGE_API_PORT: 3003
      # BFF_Message also calls Project API and Calendar API for the business references (directly since MAIR-525)
      # and refuses to start without their URLs; these stacks do not run them, so an unreachable sentinel keeps the
      # route failing cleanly (same choice as BFF_Message's own stacks).
      PROJECT_API_URL: http://127.0.0.1:9
      CALENDAR_API_URL: http://127.0.0.1:9
      # MAIR-680: Core's public key only, no JWT_SECRET: every HS256 token is refused.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
      MESSAGE_API_BASE_PATH: http://message-api:3003
      # L'annuaire des agents (contacts, utilisateur courant) vient de Core API.
      CORE_API_URL: core-api
      CORE_API_PORT: 3000
    expose:
      - "4003"
    networks:
      - backend

  bff-message-ready:
    image: curlimages/curl:latest
    container_name: message-front-sec-bff-message-ready
    depends_on:
      bff-message:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://bff-message:4003/health >/dev/null; do
      echo "waiting for bff-message..."; sleep 2; done; echo "bff-message ready"'
    networks:
      - backend

  message-front:
    image: ${TARGET_IMAGE:-message-front:security}
    container_name: message-front-sec-front
    # Image de production (Next.js standalone), identique à celle publiée par la CI.
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - node_auth_token
    depends_on:
      bff-message-ready:
        condition: service_completed_successfully
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: 5003
      # Readiness resumes on this isolated frontend origin without following Login.
      LOGIN_FRONT_URL: "${LOGIN_FRONT_URL:-http://login-front.invalid/}"
      MESSAGE_FRONT_URL: http://message-front:5003/
      BFF_MESSAGE_BASE_URL: http://bff-message:4003
    expose:
      - "5003"
    networks:
      - backend
    # curl est installé dans l'image runner. Sans cookie, le middleware répond 307
    # (reprise locale) : curl -f l'accepte, seul un statut >= 400 échoue.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5003/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  security-scan:
    image: zaproxy/zap-stable
    container_name: message-front-sec-zap
    depends_on:
      message-front:
        condition: service_healthy
    volumes:
      - ./.zap/rules.tsv:/zap/wrk/rules.tsv:ro
    # zap-baseline.py: spider + passive scan (fit for a web UI, where the BFFs replay
    #   their OpenAPI with zap-api-scan.py).
    # -j: the AJAX spider renders the page in a headless browser and follows the fetch()
    #   calls of the client bundle, so the /* routes the UI really uses are scanned
    #   too; the classic spider only sees server-rendered links (MAIR-516).
    # -c rules.tsv : les alertes informatives sont passées à IGNORE, toute autre
    #   alerte (WARN/FAIL) fait sortir zap-baseline.py en code != 0.
    # -z ... replacer: injects the accessToken cookie on every request (ACCESS_TOKEN: sub=2,
    #   role=user, 4 hours, EdDSA signed by stack_secrets.sh with the run's key like Core, MAIR-680),
    #   sinon le middleware Next.js redirige toutes les pages vers le front Login.
    command:
      - zap-baseline.py
      - -t
      - http://message-front:5003/
      - -m
      - "3"
      - -j
      - -c
      - rules.tsv
      - -z
      - "-config replacer.full_list(0).description=auth -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Cookie -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=accessToken=${ACCESS_TOKEN:?ACCESS_TOKEN is signed by stack_secrets.sh, run ./security_test.sh}"
    networks:
      - backend
