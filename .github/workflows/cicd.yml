name: Message Web Service CICD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  CICD:
    uses: mairie360/CICD/.github/workflows/frontend-cicd.yml@mair-320-rgaa-ai-preaudit  # TEMPORARY (MAIR-316): RGAA CI test, back to the release before merging
    with:
      package_name: "message-front"
      node_version: "22"
      cicd_version: "mair-320-rgaa-ai-preaudit"
      # TEMPORARY (MAIR-316): RGAA check of the CICD branch on a published image, removed before merging.
      rgaa_preview_image: "ghcr.io/mairie360/message-front:dev"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
