# Isolated end-to-end stack of the Messages front (Messages_Web_Service), MAIR-603.
#
#   ./e2e_test.sh                       (local or CI: stack + Playwright journeys of e2e/, then teardown)
#   docker compose -f docker-compose-e2e.yml up -d message-front
#       then E2E_BASE_URL=http://localhost:5003 npm run e2e      (iterate on the specs against the stack)
#
# Same services as docker-compose-performance.yml (published images of the database, the APIs and
# the BFFs, the front built here or TARGET_IMAGE), with Playwright in place of k6. The prod
# promotion (MAIR-602) runs it on the verified `staging-<sha>` front image with the other images
# at the tags of the target environment (the *_IMAGE variables).
#
# The browser always reaches the front as http://localhost:5003: the `playwright` service shares
# the front container's network, and local runs use the published port. Chromium treats localhost
# as a secure context, so it keeps the `Secure` session cookies and sends the `Sec-Fetch-Site`
# header the fronts' same-origin guards require, which a compose host name over HTTP would not.

volumes:
  postgres-data:
  redis-data:

secrets:
  node_auth_token:
    environment: NODE_AUTH_TOKEN

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

# JWT_SECRET identique sur toute la chaîne : le cookie accessToken du front est
# relayé tel quel (Bearer) à BFF Message puis à Message API.
x-api-env: &api-env
  <<: *db-env
  HOST: "0.0.0.0"
  REDIS_URL: redis://redis:6379
  JWT_SECRET: b"secret"
  JWT_TIMEOUT: 3600

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:3.3.0}
    container_name: message-front-e2e-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:3.3.0}
    container_name: message-front-e2e-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true;
    # without it the migration fails on a fresh database. Test / dev stacks only.
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: message-front-e2e-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: message-front-e2e-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  message-api:
    image: ${MESSAGE_API_IMAGE:-ghcr.io/mairie360/message-api:2.1.0}
    container_name: message-front-e2e-message-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3003
      PUBLIC_URL: http://message-api:3003
      # API >= api_lib 3.0 refuses the weak shared test secret unless this flag is set (MAIR-428),
      # and rate-limits each account (MAIR-425): the scan / load test hammer it as one user.
      JWT_ALLOW_WEAK_SECRET: "true"
      RATE_LIMIT_ENABLED: "false"
      # Message API also throttles each client IP with a token bucket (actix-governor): "0" disables it,
      # otherwise the k6 load test turns into 429s relayed as 502 by the BFF.
      RATE_LIMIT_PER_SECOND: "0"
    expose:
      - "3003"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur message-api-ready ci-dessous.

  message-api-ready:
    image: curlimages/curl:latest
    container_name: message-front-e2e-message-api-ready
    depends_on:
      message-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://message-api:3003/health >/dev/null; do
      echo "waiting for message-api..."; sleep 2; done; echo "message-api ready"'
    networks:
      - backend

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:2.2.0}
    container_name: message-front-e2e-core-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3000
      PUBLIC_URL: http://core-api:3000
      # Core refuses to start without its Resend configuration (MAIR-522). No page of this front sends an
      # e-mail through these stacks, so the key is fake and the URL never called.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend.invalid"
      EMAIL_DOMAIN: "mairie360.local"
      # API >= api_lib 3.0 refuses the weak shared test secret unless this flag is set (MAIR-428),
      # and rate-limits each account (MAIR-425): the scan / load test hammer it as one user.
      JWT_ALLOW_WEAK_SECRET: "true"
      RATE_LIMIT_ENABLED: "false"
    expose:
      - "3000"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur core-api-ready ci-dessous.

  core-api-ready:
    image: curlimages/curl:latest
    container_name: message-front-e2e-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core-api:3000/health >/dev/null; do
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  bff-message:
    image: ${BFF_MESSAGE_IMAGE:-ghcr.io/mairie360/bff-message:1.1.0}
    container_name: message-front-e2e-bff-message
    depends_on:
      seeder:
        condition: service_completed_successfully
      message-api-ready:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 4003
      MESSAGE_API_URL: message-api
      MESSAGE_API_PORT: 3003
      # BFF_Message also calls Project API and Calendar API for the business references (directly since MAIR-525)
      # and refuses to start without their URLs; these stacks do not run them, so an unreachable sentinel keeps the
      # route failing cleanly (same choice as BFF_Message's own stacks). JWT_SECRET: the BFF verifies the session
      # tokens itself.
      PROJECT_API_URL: http://127.0.0.1:9
      CALENDAR_API_URL: http://127.0.0.1:9
      JWT_SECRET: 'b"secret"'
      MESSAGE_API_BASE_PATH: http://message-api:3003
      # L'annuaire des agents (contacts, utilisateur courant) vient de Core API.
      CORE_API_URL: core-api
      CORE_API_PORT: 3000
    expose:
      - "4003"
    networks:
      - backend

  bff-message-ready:
    image: curlimages/curl:latest
    container_name: message-front-e2e-bff-message-ready
    depends_on:
      bff-message:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://bff-message:4003/health >/dev/null; do
      echo "waiting for bff-message..."; sleep 2; done; echo "bff-message ready"'
    networks:
      - backend

  message-front:
    image: ${TARGET_IMAGE:-message-front:e2e}
    container_name: message-front-e2e-front
    # Image de production (Next.js standalone), identique à celle publiée par la CI.
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - node_auth_token
    depends_on:
      bff-message-ready:
        condition: service_completed_successfully
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: 5003
      # Readiness resumes on this isolated frontend origin without following Login.
      LOGIN_FRONT_URL: "${LOGIN_FRONT_URL:-http://login-front.invalid/}"
      # Public origin of the front, the one its same-origin guards accept on writes: the browser of
      # the journeys reaches it as localhost (see the header), in the stack as on the host.
      MESSAGE_FRONT_URL: http://localhost:5003/
      BFF_MESSAGE_BASE_URL: http://bff-message:4003
    expose:
      - "5003"
    ports:
      - "${E2E_FRONT_PORT:-5003}:5003"
    networks:
      - backend
    # curl est installé dans l'image runner. Sans cookie, le middleware répond 307
    # (reprise locale) : curl -f l'accepte, seul un statut >= 400 échoue.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5003/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  playwright:
    # Browsers and system dependencies of the pinned @playwright/test (e2e/package.json): keep the
    # two versions identical (the test runner refuses a browser build of another version).
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    container_name: message-front-e2e-playwright
    # The host user (exported by e2e_test.sh): the report written in ./e2e-report stays theirs.
    user: "${E2E_UID:-1000}:${E2E_GID:-1000}"
    depends_on:
      message-front:
        condition: service_healthy
    volumes:
      - ./e2e:/src/e2e:ro
      - ./e2e-report:/report
    environment:
      CI: "true"
      E2E_BASE_URL: http://localhost:5003
      E2E_JWT_SECRET: 'b"secret"'
      E2E_REPORT_DIR: /report
      HOME: /tmp
      E2E_MANAGER_USER_ID: "2"
      E2E_MEMBER_USER_ID: "3"
      E2E_OUTSIDER_USER_ID: "4"
    # The specs are copied: /src/e2e is read-only and the host must not receive the runner's node_modules.
    command: >
      sh -c 'cp -r /src/e2e /tmp/work && cd /tmp/work && npm ci --no-audit --no-fund
      && npx playwright test'
    # Same network namespace as the front: the browser opens http://localhost:5003 (see the header).
    network_mode: service:message-front
