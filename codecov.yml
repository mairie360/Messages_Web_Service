# Project coverage floor: 60 %, the same as npm test (--test-coverage-lines=60
# in package.json). Without this file Codecov applies its default `auto`
# target: a PR at 82 % fails as soon as `main` is above it, because imports,
# types and comments at module top level count as uncovered (the tests load
# TypeScript with inline source maps, and Node's coverage reports that code
# as never run).
coverage:
  status:
    project:
      default:
        target: 60%
        # No extra tolerance: 60 % already is the floor.
        threshold: 0%
        if_ci_failed: error
    patch:
      default:
        target: 60%
        threshold: 0%
        # Patch coverage suffers most from the top-level under-reporting above
        # (a new module is mostly top-level code): shown on the PR, never
        # blocking. The project floor still gates real drops.
        informational: true

# Coverage is only measured on src/ (--test-coverage-include='src/**').
ignore:
  - "tests/**"
  - "scripts/**"
  - "contracts/**"

comment:
  layout: "condensed_header, diff, files"
  require_changes: true
